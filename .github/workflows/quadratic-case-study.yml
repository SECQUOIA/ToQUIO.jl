name: Fresh quadratic study validation

on:
  pull_request:
    paths:
      - '.github/workflows/quadratic-case-study.yml'
      - 'benchmarks/quadratic_case_study/**'
      - 'benchmarks/metropolis.jl'
      - 'src/**'
      - 'Project.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/quadratic-case-study.yml'
      - 'benchmarks/quadratic_case_study/**'
      - 'benchmarks/metropolis.jl'
      - 'src/**'
      - 'Project.toml'

permissions:
  contents: read

jobs:
  validate:
    name: Fresh models, exact encodings and replay
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      JULIA_NUM_PRECOMPILE_TASKS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10.11'
      - uses: julia-actions/cache@v3
      - name: Independent model, compiler and trace validation (SCIP)
        shell: bash
        run: |
          python3 -m unittest discover -s benchmarks/quadratic_case_study -p 'test_*.py'
          runner_julia=$(command -v julia)
          runner_depot="${JULIA_DEPOT_PATH:-$HOME/.julia}"
          sudo systemd-run --scope --quiet -p MemoryMax=4G -p MemorySwapMax=0 -p CPUQuota=100% \
            runuser -u "$(id -un)" -- env JULIA_DEPOT_PATH="$runner_depot" \
            JULIA_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 JULIA_NUM_PRECOMPILE_TASKS=1 \
            timeout 600 "$runner_julia" --project=benchmarks/quadratic_case_study benchmarks/quadratic_case_study/setup.jl
          sudo systemd-run --scope --quiet -p MemoryMax=4G -p MemorySwapMax=0 -p CPUQuota=100% \
            runuser -u "$(id -un)" -- env JULIA_DEPOT_PATH="$runner_depot" \
            JULIA_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 JULIA_NUM_PRECOMPILE_TASKS=1 \
            timeout 600 "$runner_julia" --project=benchmarks/quadratic_case_study benchmarks/quadratic_case_study/runtests.jl
          sudo systemd-run --scope --quiet -p MemoryMax=4G -p MemorySwapMax=0 -p CPUQuota=100% \
            runuser -u "$(id -un)" -- env JULIA_DEPOT_PATH="$runner_depot" \
            JULIA_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 JULIA_NUM_PRECOMPILE_TASKS=1 \
            timeout 900 python3 benchmarks/quadratic_case_study/validate_entrypoints.py \
            "$RUNNER_TEMP/fresh-study-validation" --julia "$runner_julia" --backend SCIP
      - name: Verify retained campaign and regenerate its published numbers
        shell: bash
        run: |
          packet=benchmarks/quadratic_case_study/results/protocol_v1
          if [ -f "$packet/index.json" ]; then
            study_raw="$RUNNER_TEMP/fresh-study-packet"
            study_report="$RUNNER_TEMP/fresh-study-report"
            sudo systemd-run --scope --quiet -p MemoryMax=4G -p MemorySwapMax=0 -p CPUQuota=100% \
              runuser -u "$(id -un)" -- env PYTHONDONTWRITEBYTECODE=1 timeout 1800 python3 benchmarks/quadratic_case_study/pack.py extract "$packet" "$study_raw"
            frozen_profile="$study_raw/source/benchmarks/quadratic_case_study"
            analysis_profile="$study_raw/analysis-source/benchmarks/quadratic_case_study"
            sudo systemd-run --scope --quiet -p MemoryMax=4G -p MemorySwapMax=0 -p CPUQuota=100% \
              runuser -u "$(id -un)" -- env PYTHONDONTWRITEBYTECODE=1 timeout 1800 python3 "$analysis_profile/report.py" "$study_raw" "$study_report"
            python3 "$analysis_profile/analysis.py" "$study_report"
            python3 "$analysis_profile/compare.py" "$packet/report" "$study_report"
            runner_julia=$(command -v julia)
            runner_depot="${JULIA_DEPOT_PATH:-$HOME/.julia}"
            sudo systemd-run --scope --quiet -p MemoryMax=4G -p MemorySwapMax=0 -p CPUQuota=100% \
              runuser -u "$(id -un)" -- env JULIA_DEPOT_PATH="$runner_depot" \
              JULIA_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 JULIA_NUM_PRECOMPILE_TASKS=1 \
              timeout 300 "$runner_julia" --project="$frozen_profile" "$frozen_profile/replay.jl" "$study_raw" 6
          else
            echo "No measurement packet yet; validating the source implementation."
          fi
